<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Still Iconic — La Maison de la Revente</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=Geist:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --noir: #0a0a0a;
    --ivoor: #fafafa;
    --wit: #ffffff;
    --champagne: #d8c49a;
    --goud: #a8894f;
    --goud-diep: #8a6f3c;
    --inkt: #141414;
    --grijs: #4a4a4a;
    --lijn: rgba(10, 10, 10, .14);
    --lijn-goud: rgba(168, 137, 79, .35);
    --groen: #3e5c46;
    --bordeaux: #7a3b3b;
    /* Zelfde typografie als de echte app: Playfair Display + Geist */
    --serif: "Playfair Display", "Bodoni MT", Georgia, serif;
    --sans: "Geist", "Helvetica Neue", Helvetica, "Segoe UI", Arial, sans-serif;
  }
  /* ─────────────────────────────────────────────────────────
     Typografische schaal. Alles op de site valt in een van deze
     treden; wijk hier niet van af, anders gaat het rammelen.

     SERIF (Playfair) — alleen voor wat eruit moet springen
       .kop           30px  paginatitels
       prijs          27px  op de detailpagina
       .wachtrij-titel 17px stuknamen in lijsten
       totaalregels   19px  in bonnen

     SANS (Geist)
       14.5px/400  introtekst (.sub)
       14px/400    gegevens en lopende tekst (specs, bonnen, bubbels)
       14px/500    aanklikbaar (navigatie, menu-items)
       12.5px/400  meta en toelichting (.biedregel, .wachtrij-meta)
       11px/600    sectiekoppen in kapitalen
       10px/500    labels en chips in kapitalen
     ───────────────────────────────────────────────────────── */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    font-family: var(--serif);
    background: var(--ivoor);
    color: var(--inkt);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  /* ─── Matelassé-ruitpatroon ─── */
  .quilt {
    background-color: #f6f6f5;
    background-image:
      linear-gradient(45deg,  transparent 48.5%, rgba(10,10,10,.07) 48.5%, rgba(10,10,10,.07) 51.5%, transparent 51.5%),
      linear-gradient(-45deg, transparent 48.5%, rgba(10,10,10,.07) 48.5%, rgba(10,10,10,.07) 51.5%, transparent 51.5%);
    background-size: 46px 46px;
  }
  .quilt-donker {
    background-color: var(--noir);
    background-image:
      linear-gradient(45deg,  transparent 48%, rgba(255,255,255,.07) 48%, rgba(255,255,255,.07) 52%, transparent 52%),
      linear-gradient(-45deg, transparent 48%, rgba(255,255,255,.07) 48%, rgba(255,255,255,.07) 52%, transparent 52%);
    background-size: 54px 54px;
  }

  /* ─── Maison-kop ─── */
  .maison {
    color: var(--ivoor);
    text-align: center;
    padding: 40px 20px 34px;
    position: relative;
  }
  .maison-naam {
    font-size: 34px;
    letter-spacing: .42em;
    text-transform: uppercase;
    font-weight: 400;
    text-indent: .42em;
  }
  .maison-naam .amp { color: var(--champagne); }
  .maison-naam { white-space: nowrap; }
  .maison-sub {
    font-family: var(--sans);
    font-size: 10px;
    letter-spacing: .38em;
    text-transform: uppercase;
    color: rgba(255,255,255,.55);
    margin-top: 12px;
    text-indent: .38em;
  }
  .maison-lijn {
    width: 54px; height: 1px;
    background: var(--goud);
    margin: 16px auto 0;
  }
  .demo-chip {
    position: absolute; top: 14px; right: 16px;
    font-family: var(--sans);
    font-size: 9px; letter-spacing: .22em; text-transform: uppercase;
    color: rgba(255,255,255,.6);
    border: 1px solid rgba(255,255,255,.25);
    padding: 6px 12px;
  }
  /* ─── Demo-rolwisselaar rechtsboven ─── */
  .demo-hoek {
    position: absolute; top: 14px; right: 16px;
    display: flex; align-items: center; gap: 10px;
  }
  .rolwissel { display: flex; border: 1px solid rgba(255,255,255,.25); }
  .rolwissel button {
    font-family: var(--sans); font-size: 9px; letter-spacing: .18em; text-transform: uppercase;
    background: none; border: none; color: rgba(255,255,255,.55);
    padding: 6px 11px; cursor: pointer; position: relative; transition: all .15s;
  }
  .rolwissel button + button { border-left: 1px solid rgba(255,255,255,.18); }
  .rolwissel button:hover { color: var(--champagne); }
  .rolwissel button.actief { background: var(--champagne); color: var(--noir); font-weight: 700; }
  .rolwissel .notif {
    position: absolute; top: 3px; right: 4px;
    width: 5px; height: 5px; border-radius: 50%; background: var(--goud);
    display: none;
  }
  .rolwissel button.actief .notif { background: var(--noir); }

  /* ─── Hoofdnavigatie (echte site-navigatie) ─── */
  .hoofdnav {
    display: flex; justify-content: center; flex-wrap: wrap; gap: 0;
    background: var(--wit); border-bottom: 1px solid var(--lijn);
    position: sticky; top: 0; z-index: 20;
  }
  .navlink {
    font-family: var(--sans); font-size: 11.5px; font-weight: 500; letter-spacing: .16em; text-transform: uppercase;
    color: #2a2a2a; background: none; border: none;
    padding: 18px 22px 15px; cursor: pointer;
    border-bottom: 1px solid transparent; transition: color .15s;
  }
  .navlink:hover { color: var(--noir); }
  .navlink.actief { color: var(--noir); border-bottom-color: var(--goud); }
  .navlink .telling { color: var(--goud-diep); margin-left: 5px; font-size: 9.5px; }

  /* ─── Mega-menu ─── */
  .navwrap { position: relative; }
  .megamenu {
    position: absolute; left: 0; right: 0; top: 100%;
    background: var(--wit); border-bottom: 1px solid var(--lijn);
    box-shadow: 0 16px 40px rgba(10,10,10,.10);
    z-index: 30; display: none;
  }
  .megamenu.open { display: block; animation: megafade .18s ease; }
  @keyframes megafade { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
  .mega-binnen {
    max-width: 1180px; margin: 0 auto; padding: 30px 24px 34px;
    display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 26px 34px;
  }
  .mega-kolom h4 {
    font-family: var(--sans); font-size: 10px; letter-spacing: .2em; text-transform: uppercase;
    color: var(--goud-diep); font-weight: 600; padding-bottom: 8px; margin-bottom: 8px;
    border-bottom: 1px solid var(--lijn);
  }
  .mega-link {
    display: flex; justify-content: space-between; gap: 10px; width: 100%;
    font-family: var(--sans); font-size: 14px; font-weight: 500; color: #2a2a2a; text-align: left;
    background: none; border: none; padding: 7px 0; cursor: pointer; transition: color .12s;
  }
  .mega-link:hover { color: var(--noir); }
  .mega-link:hover .m-aantal { color: var(--goud-diep); }
  .m-aantal { color: #8a8378; font-size: 11px; }
  .mega-uitgelicht {
    border: 1px solid var(--lijn); padding: 14px; text-align: center; cursor: pointer;
    transition: box-shadow .2s;
  }
  .mega-uitgelicht:hover { box-shadow: 0 8px 22px rgba(10,10,10,.08); }
  .mega-uitgelicht .mf { height: 90px; display: flex; align-items: center; justify-content: center; }
  .mega-uitgelicht .mf svg { width: 74px; height: 74px; }
  .mega-uitgelicht .mt { font-family: var(--serif); font-size: 13.5px; margin-top: 6px; }
  .mega-uitgelicht .mp { font-family: var(--sans); font-size: 11.5px; color: var(--goud-diep); margin-top: 3px; }
  @media (max-width: 640px) {
    .navlink { padding: 13px 11px 11px; letter-spacing: .12em; font-size: 9.5px; }
    .demo-hoek { position: static; justify-content: center; margin-top: 14px; }
  }

  /* ─── Rol-navigatie ─── */
  .roltabs {
    display: flex;
    justify-content: center;
    gap: 0;
    background: var(--wit);
    border-bottom: 1px solid var(--lijn);
    position: sticky; top: 0; z-index: 20;
  }
  .roltab {
    font-family: var(--sans);
    font-size: 11px;
    letter-spacing: .26em;
    text-transform: uppercase;
    color: var(--grijs);
    background: none; border: none;
    padding: 20px 34px 17px;
    cursor: pointer;
    border-bottom: 1px solid transparent;
    transition: color .2s;
    position: relative;
  }
  .roltab:hover { color: var(--inkt); }
  .roltab.actief { color: var(--inkt); border-bottom-color: var(--goud); }
  .roltab .notif {
    position: absolute; top: 12px; right: 14px;
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--goud);
    display: none;
    animation: notifpols 1.6s infinite;
  }
  @keyframes notifpols {
    0%, 100% { box-shadow: 0 0 0 0 rgba(168,137,79,.45); }
    55% { box-shadow: 0 0 0 6px rgba(168,137,79,0); }
  }

  .view { display: none; max-width: 1180px; margin: 0 auto; padding: 46px 24px 90px; animation: fade .35s ease; }
  .view.actief { display: block; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  /* ─── Typografie ─── */
  h2.kop { font-size: 30px; font-weight: 400; letter-spacing: .02em; }
  .voorregel {
    font-family: var(--sans);
    font-size: 10.5px; font-weight: 500; letter-spacing: .24em; text-transform: uppercase;
    color: #3a3a3a; margin-bottom: 10px;
  }
  .sub { font-family: var(--sans); font-size: 14.5px; color: #3a3a3a; margin-top: 10px; line-height: 1.75; }
  .centreer { text-align: center; }
  .intro { max-width: 520px; margin: 0 auto 44px; }

  /* ─── Filterbalk ─── */
  .filterbalk {
    display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end;
    background: var(--wit); border: 1px solid var(--lijn);
    padding: 18px 20px; margin-bottom: 26px;
  }
  .filterveld { display: flex; flex-direction: column; gap: 6px; }
  .filterveld .fl {
    font-family: var(--sans); font-size: 10px; font-weight: 500; letter-spacing: .16em; text-transform: uppercase; color: #3a3a3a;
  }
  .fsel {
    font-family: var(--sans); font-size: 13px;
    border: 1px solid var(--lijn); background: var(--wit); color: var(--inkt);
    padding: 8px 10px; min-width: 110px; cursor: pointer;
  }
  .fsel:focus { outline: none; border-color: var(--noir); }
  .filter-wissen {
    font-family: var(--sans); font-size: 10px; letter-spacing: .2em; text-transform: uppercase;
    color: var(--grijs); background: none; border: none; cursor: pointer; text-decoration: underline;
    padding: 10px 4px;
  }
  .telregel { font-family: var(--sans); font-size: 11px; font-weight: 500; letter-spacing: .18em; text-transform: uppercase; color: #3a3a3a; margin-bottom: 18px; }
  .allin { font-family: var(--sans); font-size: 11px; color: #4a4a4a; margin-top: 4px; }
  .verif-goud { color: var(--goud-diep); font-weight: 500; }

  /* ─── Wishlist ─── */
  .wens-knop {
    position: absolute; top: 10px; right: 10px; z-index: 2;
    width: 32px; height: 32px; border: 1px solid var(--lijn); background: rgba(255,255,255,.9);
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    font-size: 14px; line-height: 1; color: #6a6a6a; transition: all .15s; padding: 0;
  }
  .wens-knop:hover { border-color: var(--goud); color: var(--goud-diep); }
  .wens-knop.bewaard { border-color: var(--goud); color: var(--goud-diep); background: #fff; }
  .kaart { position: relative; }
  .wens-groot {
    display: inline-flex; align-items: center; gap: 8px;
    font-family: var(--sans); font-size: 11px; font-weight: 500; letter-spacing: .2em; text-transform: uppercase;
    background: none; border: none; cursor: pointer; color: #4a4a4a; padding: 14px 0 0;
  }
  .wens-groot:hover, .wens-groot.bewaard { color: var(--goud-diep); }

  /* ─── Beschrijving en verkopersnotitie ─── */
  .ai-beschrijving {
    font-family: var(--sans); font-size: 14.5px; line-height: 1.7; color: #2e2e2e;
    margin: 14px 0 20px; max-width: 46ch;
  }
  .verkoper-notitie {
    border-left: 2px solid var(--goud); padding: 2px 0 2px 16px; margin-top: 24px;
  }
  .verkoper-notitie .vn-kop {
    font-family: var(--sans); font-size: 10px; font-weight: 500; letter-spacing: .16em;
    text-transform: uppercase; color: var(--goud-diep); margin-bottom: 6px;
  }
  .verkoper-notitie p { font-family: var(--serif); font-size: 16px; line-height: 1.6; color: var(--inkt); }
  .verkoper-notitie .vn-naam { font-family: var(--sans); font-size: 12px; color: #4a4a4a; margin-top: 6px; }

  /* ─── Koper/verkoper-wisselaar ─── */
  .wisselaar {
    display: flex; justify-content: center; gap: 0; margin: 0 auto 30px; max-width: 340px;
    border: 1px solid var(--lijn);
  }
  .wissel-knop {
    flex: 1; font-family: var(--sans); font-size: 10px; letter-spacing: .24em; text-transform: uppercase;
    background: var(--wit); color: var(--grijs); border: none; padding: 13px 10px; cursor: pointer;
    transition: all .15s;
  }
  .wissel-knop.actief { background: var(--noir); color: var(--champagne); }
  .status-nu {
    display: flex; flex-wrap: wrap; align-items: center; gap: 14px;
    border: 1px solid var(--lijn-goud); background: rgba(216,196,154,.08);
    padding: 16px 20px; margin: 20px 0;
  }
  .status-nu .groot { font-family: var(--serif); font-size: 19px; }
  .status-nu .toel { font-family: var(--sans); font-size: 11.5px; color: var(--grijs); line-height: 1.6; flex: 1; min-width: 200px; }

  /* ─── Conditierapport / bieden ─── */
  .zone-rij { display: flex; justify-content: space-between; gap: 18px; padding: 9px 0; border-bottom: 1px solid var(--lijn); font-size: 13px; }
  .zone-rij dt { font-family: var(--sans); font-size: 10.5px; font-weight: 500; letter-spacing: .14em; text-transform: uppercase; color: var(--grijs); white-space: nowrap; padding-top: 3px; }
  .zone-rij dd { text-align: right; font-family: var(--sans); font-size: 14px; color: var(--inkt); }
  .incl-chip {
    display: inline-block; font-family: var(--sans); font-size: 10px; letter-spacing: .12em; text-transform: uppercase;
    border: 1px solid var(--lijn-goud); color: var(--goud-diep); padding: 5px 10px; margin: 0 6px 6px 0;
  }
  .biedpaneel { border: 1px solid var(--lijn); background: var(--wit); padding: 18px 20px; margin-top: 14px; }
  .biedpaneel input {
    font-family: var(--sans); font-size: 14px; border: 1px solid var(--lijn); padding: 10px 12px; width: 140px;
  }
  .biedpaneel input:focus { outline: none; border-color: var(--noir); }
  .biedregel { font-family: var(--sans); font-size: 12.5px; color: #3a3a3a; margin-top: 8px; line-height: 1.7; }

  /* ─── Account: zijnavigatie ─── */
  .account-layout { display: flex; gap: 34px; align-items: flex-start; }
  .account-nav { width: 240px; flex-shrink: 0; position: sticky; top: 74px; }
  .nav-groep { margin-bottom: 22px; }
  .nav-groep-kop {
    font-family: var(--sans); font-size: 10px; font-weight: 500; letter-spacing: .2em; text-transform: uppercase;
    color: #4a4a4a; padding: 0 0 8px; border-bottom: 1px solid var(--lijn); margin-bottom: 6px;
  }
  .nav-item {
    display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%;
    font-family: var(--sans); font-size: 14px; font-weight: 500; text-align: left;
    background: none; border: none; border-left: 2px solid transparent;
    padding: 9px 12px; cursor: pointer; color: #3a3a3a; transition: all .15s;
  }
  .nav-item:hover { color: var(--inkt); background: rgba(10,10,10,.03); }
  .nav-item.actief { color: var(--inkt); border-left-color: var(--goud); background: rgba(216,196,154,.10); font-weight: 600; }
  .nav-badge {
    font-family: var(--sans); font-size: 9.5px; font-weight: 500; min-width: 19px; text-align: center;
    background: var(--noir); color: var(--champagne); padding: 2px 6px; border-radius: 10px;
  }
  .nav-badge.stil { background: none; color: var(--grijs); }
  .account-inhoud { flex: 1; min-width: 0; }
  @media (max-width: 720px) {
    .account-layout { flex-direction: column; }
    .account-nav { width: 100%; position: static; }
    .nav-groep { margin-bottom: 14px; }
  }

  /* ─── Statusbalk met platformcijfers ─── */
  .statusbalk {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
    border: 1px solid var(--lijn); background: var(--wit); margin-bottom: 26px;
  }
  .stat { padding: 18px 16px; text-align: center; border-right: 1px solid var(--lijn); }
  .stat:last-child { border-right: none; }
  .stat-getal { font-family: var(--serif); font-size: 25px; line-height: 1.1; }
  .stat-getal .plus { color: var(--goud-diep); font-size: 17px; }
  .stat-label {
    font-family: var(--sans); font-size: 10px; font-weight: 500; letter-spacing: .16em;
    text-transform: uppercase; color: #3a3a3a; margin-top: 7px;
  }
  @media (max-width: 640px) { .stat { padding: 13px 8px; } .stat-getal { font-size: 20px; } }

  /* ─── Berichten ─── */
  .gesprek-lijst { border: 1px solid var(--lijn); background: var(--wit); }
  .gesprek {
    display: flex; gap: 14px; align-items: flex-start; width: 100%;
    padding: 16px 18px; border: none; border-bottom: 1px solid var(--lijn);
    background: none; cursor: pointer; text-align: left; transition: background .12s;
  }
  .gesprek:last-child { border-bottom: none; }
  .gesprek:hover { background: #fafaf9; }
  .gesprek.ongelezen { border-left: 3px solid var(--goud); }
  .gesprek-kop { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
  .gesprek-naam { font-family: var(--serif); font-size: 16px; }
  .gesprek-tijd { font-family: var(--sans); font-size: 12.5px; color: #3a3a3a; white-space: nowrap; }
  .gesprek-over { font-family: var(--sans); font-size: 10px; font-weight: 500; letter-spacing: .14em; text-transform: uppercase; color: var(--goud-diep); margin: 3px 0 5px; }
  .gesprek-laatste { font-family: var(--sans); font-size: 14px; color: var(--inkt); line-height: 1.55; }
  .bubbels { display: flex; flex-direction: column; gap: 12px; margin: 18px 0; }
  .bubbel { max-width: 78%; padding: 13px 17px; font-family: var(--sans); font-size: 14px; line-height: 1.7; }
  .bubbel.hun { background: #f4f3f1; border: 1px solid var(--lijn); align-self: flex-start; }
  .bubbel.ik { background: var(--noir); color: var(--ivoor); align-self: flex-end; }
  .bubbel.systeem {
    align-self: center; max-width: 100%; text-align: center; background: none;
    border-top: 1px solid var(--lijn); border-bottom: 1px solid var(--lijn);
    font-size: 11.5px; color: #3a3a3a; padding: 9px 14px;
  }
  .bubbel .tijd { display: block; font-size: 10px; opacity: .6; margin-top: 5px; }
  .bericht-balk { display: flex; gap: 10px; align-items: flex-end; margin-top: 6px; }
  .bericht-balk textarea {
    flex: 1; font-family: var(--sans); font-size: 14px; border: 1px solid var(--lijn);
    padding: 11px 13px; resize: vertical; min-height: 46px; color: var(--inkt);
  }
  .bericht-balk textarea:focus { outline: none; border-color: var(--noir); }
  .veilig-kader {
    font-family: var(--sans); font-size: 13px; line-height: 1.75; color: #333;
    border: 1px solid var(--lijn-goud); background: rgba(216,196,154,.09);
    padding: 12px 16px; margin-bottom: 16px;
  }
  .snelantwoorden { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 4px; }
  .snelantwoord {
    font-family: var(--sans); font-size: 12.5px; border: 1px solid var(--lijn);
    background: var(--wit); padding: 7px 12px; cursor: pointer; color: #333;
  }
  .snelantwoord:hover { border-color: var(--noir); }

  /* ─── Atelier: fasenbord ─── */
  .fase-blok { margin-bottom: 26px; }
  .fase-kop {
    display: flex; align-items: center; gap: 12px; margin-bottom: 12px;
    font-family: var(--sans); font-size: 11px; font-weight: 600; letter-spacing: .2em; text-transform: uppercase; color: var(--inkt);
  }
  .fase-kop .nr {
    width: 26px; height: 26px; border-radius: 50%; flex-shrink: 0;
    border: 1px solid var(--noir); display: flex; align-items: center; justify-content: center;
    font-family: var(--serif); font-size: 12px; letter-spacing: 0;
  }
  .fase-kop.actief .nr { background: var(--noir); color: var(--champagne); }
  .fase-kop .telling { font-family: var(--serif); font-size: 13px; letter-spacing: 0; color: var(--grijs); }
  .fase-kop::after { content: ''; flex: 1; height: 1px; background: var(--lijn); }

// Trackingcodes: PostNL-formaat, deterministisch opgebouwd zodat ze stabiel blijven
function trackCode(zaad) {
  let h = 0;
  for (const teken of String(zaad)) h = (h * 31 + teken.charCodeAt(0)) % 10000000000000;
  return '3SSI' + String(h).padStart(13, '0').slice(-13);
}

function bodActie(id, actie) {
  const i = openBiedingen.findIndex(b => b.id === id);
  if (i === -1) return;
  const b = openBiedingen.splice(i, 1)[0];
  let status;
  if (actie === 'accepteer') {
    status = 'Accepted';
    toast(`Offer of <b>${eur(b.bedrag)}</b> accepted. The buyer has 24 hours to pay; the piece stays reserved until then.`);
  } else if (actie === 'tegenbod') {
    const tegen = Math.round((b.bedrag + b.vraagprijs) / 2 / 50) * 50;
    status = `Counter-offer ${eur(tegen)} sent`;
    toast(`Counter-offer of <b>${eur(tegen)}</b> sent. The buyer can accept, decline or bid again.`);
  } else {
    status = 'Declined';
    toast('Offer declined. The piece stays in the collection.');
  }
  biedHistorie.unshift({ stuk: b.stuk, bieder: b.bieder, bedrag: b.bedrag, status, datum: 'today' });
  render();
}

const SFEER = {
  tas: ['carries beautifully', 'sits close to the body', 'holds its shape'],
  sieraad: ['catches the light', 'wears effortlessly', 'layers well'],
  kleding: ['falls softly', 'tailors close', 'wears season after season'],

function aiBeschrijving(it) {
  const staat = {
    'New': 'Unworn and as it left the boutique',
    'Excellent': 'Barely worn and beautifully kept',
    'Very good': 'Lightly worn, with the patina you expect of the era',
    'Good': 'Worn and loved, with honest signs of use',
    'Visible wear': 'Well worn, with marks that are priced in',
  }[it.conditie] || 'Kept in good order';
  const sfeer = SFEER[it.categorie][it.id % 3];
  const hw = it.hardware && it.hardware !== 'n/a'
    ? ` with ${it.hardware.toLowerCase()} ${it.categorie === 'kleding' ? 'buttons' : 'hardware'}`
    : '';
  const kleur = it.kleur.toLowerCase();
  const model = it.model.toLowerCase();
  const materiaal = it.materiaal.toLowerCase();
  // Voorkom herhaling als het materiaal al in de modelnaam zit ("tweed tweed jacket")
  const stof = model.includes(materiaal) ? '' : `${materiaal} `;
  const lidwoord = /^[aeiou]/.test(kleur) ? 'An' : 'A';
  return `${staat}. ${lidwoord} ${kleur} ${stof}${model} from ${it.jaar}${hw}, a piece that ${sfeer}.`;
}

    (!filt.nieuw || it.jaar >= 2010) &&
    (!filt.verificatie || it.verificatie === filt.verificatie)
  );
}

const eur = n => '€ ' + n.toLocaleString('en-GB', { minimumFractionDigits: n % 1 ? 2 : 0 });
const art = (naam) => TEKENINGEN[naam];

function toast(html) {
  const t = document.getElementById('toast');
  t.innerHTML = html;
  t.classList.add('zichtbaar');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('zichtbaar'), 3600);
}
function notif(rol, aan) {
  document.getElementById('notif-' + rol).style.display = aan ? 'block' : 'none';
}
let huidigeRol = 'koper';

function toonRol(rol) {
  huidigeRol = rol;
  document.querySelectorAll('.rolwissel button').forEach(b => b.classList.toggle('actief', b.dataset.rol === rol));
  document.querySelectorAll('.view').forEach(v => v.classList.remove('actief'));
  document.getElementById('view-' + rol).classList.add('actief');
  notif(rol, false);
  render();
}

      `<button class="navlink ${actief('alles')}" onclick="navCategorie('')" onmouseenter="sluitMega()">The Collection</button>`,

    const telFase = k => ANDERE_ORDERS.filter(o => o.fase === k).length + (order && !order.afgekeurd && order.status === k ? 1 : 0);
    const totaal = ATELIER_FASEN.reduce((s, f) => s + telFase(f.key), 0);
    links = ['werkbord', 'papertrail', 'voorraad', 'rapportage'].map(k =>
      `<button class="navlink ${atelierTab === k ? 'actief' : ''}" onclick="atelierTab='${k}';render()">${

    links = [
      `<button class="navlink ${accountTab === 'overzicht' && mijnRol === 'koper' ? 'actief' : ''}" onclick="accountTab='overzicht';mijnRol='koper';accountSectie=null;accountDetail=null;render()">As buyer</button>`,
      `<button class="navlink ${accountTab === 'overzicht' && mijnRol === 'verkoper' ? 'actief' : ''}" onclick="accountTab='overzicht';mijnRol='verkoper';accountSectie=null;verkochtDetail=null;render()">As seller${openBiedingen.length ? `<span class="telling">${openBiedingen.length}</span>` : ''}</button>`,

function navNieuw() {

// Vanuit het mega-menu: categorie plus een verfijning in een klik
function navVerfijnd(cat, veld, waarde) {
  filt = { model: '', kleur: '', materiaal: '', hardware: '', conditie: '', era: '', categorie: cat, nieuw: false };
  if (veld) filt[veld] = waarde;
  scherm = 'browse'; sluitMega(); render();
}

function sluitMega() { document.getElementById('megamenu').classList.remove('open'); }

function openMega(cat) {
  const menu = document.getElementById('megamenu');
  const inCat = ITEMS.filter(i => i.categorie === cat);
  const uniek = veld => [...new Set(inCat.map(i => veld === 'era' ? eraVan(i) : i[veld]))].filter(v => v && v !== 'n/a').sort();
  const tel = (veld, w) => inCat.filter(i => (veld === 'era' ? eraVan(i) : i[veld]) === w).length;

  const kolom = (titel, veld, waarden) => `
    <div class="mega-kolom">
      <h4>${titel}</h4>
      ${waarden.map(w => `
        <button class="mega-link" onclick="navVerfijnd('${cat}','${veld}','${w}')">${w}</button>`).join('')}
    </div>`;

  // Duurste stuk uit de categorie als uitgelicht item
  const ster = [...inCat].sort((a, b) => b.prijs - a.prijs)[0];

  menu.innerHTML = `
    <div class="mega-binnen">
      ${kolom(cat === 'tas' ? 'Models' : 'Type', 'model', uniek('model'))}
      ${kolom('Material', 'materiaal', uniek('materiaal'))}
      ${kolom('Colour', 'kleur', uniek('kleur'))}
      ${kolom('Era', 'era', uniek('era'))}
      <div class="mega-kolom">
        <h4>Featured</h4>
        ${ster ? `
          <div class="mega-uitgelicht" onclick="naarDetail(${ITEMS.indexOf(ster)})">
            <div class="mf quilt">${art(ster.art)}</div>
            <div class="mt">${ster.titel}</div>
            <div class="mp">${eur(ster.prijs)}</div>
          </div>` : ''}
        <button class="mega-link" style="margin-top:10px;color:var(--goud-diep)" onclick="navCategorie('${cat}')">View all ${CATEGORIE_LABEL[cat].toLowerCase()} &rarr;</button>
      </div>
    </div>`;
  menu.classList.add('open');
}

function verstuurBod(vraagprijs) {
  const invoer = document.getElementById('biedbedrag');
  const bedrag = Number(invoer && invoer.value);
  const min = Math.ceil(vraagprijs * 0.7);
  if (!bedrag || bedrag < min || bedrag > vraagprijs) {
    toast(`An offer must be between <b>${eur(min)}</b> and <b>${eur(vraagprijs)}</b>.`);
    return;
  }
  biedVerstuurd = bedrag;
  biedOpen = false;
  // Het bod komt direct binnen in de actie-inbox van de verkoper
  openBiedingen.unshift({
    id: 'K' + (++bodTeller),
    stuk: `${kijkItem.titel} ${kijkItem.jaar}`,
    bieder: 'Koos K. (you, as demo buyer)',
    bedrag,
    vraagprijs,
    verloopt: 'expires in 48 hours',
  });
  notif('account', true);
  toast('Offer sent. <b>View it as a seller under My account.</b>');
  render();
}

function toggleWish(id, e) {
  if (e) { e.stopPropagation(); e.preventDefault(); }
  if (wishlist.has(id)) { wishlist.delete(id); toast('Removed from your wishlist.'); }
  else { wishlist.add(id); toast('Saved to your wishlist. We will let you know if the price drops.'); }
  render();
}

function betaal() {

  checkoutUpgrade = null;
  scherm = 'tracking';

function renderAtelier() {
  const v = document.getElementById('view-atelier');
  if (atelierTab === 'papertrail') { v.innerHTML = htmlPapertrail(); return; }
  if (atelierTab === 'voorraad')   { v.innerHTML = htmlVoorraad(); return; }
  if (atelierTab === 'rapportage') { v.innerHTML = htmlRapportage(); return; }
  const kop = `
    <div class="centreer intro">
      <div class="voorregel">The Atelier</div>
      <h2 class="kop">Expertise and authentication</h2>
      <p class="sub">Every piece moves through five fixed phases. At each transition we generate the label, follow the shipment and the buyer receives an automatic update.</p>
    </div>`;

  // De demo-order zit in een van de fasen en krijgt daar een werkkaart met acties
  const demoFase = order && !order.afgekeurd ? order.status : null;

  const bord = ATELIER_FASEN.map(f => {
    const anderen = ANDERE_ORDERS.filter(o => o.fase === f.key);
    const heeftDemo = demoFase === f.key;
    const totaal = anderen.length + (heeftDemo ? 1 : 0);
    return `
      <div class="fase-blok">
        <div class="fase-kop ${heeftDemo ? 'actief' : ''}">
          <span class="nr">${f.nr}</span>${f.titel}<span class="telling">${totaal}</span>
        </div>
        ${heeftDemo ? werkkaart(f) : ''}
        ${anderen.map(o => `
          <div class="wachtrij-item">
            <div class="mini-foto quilt">${art(o.art)}</div>
            <div class="wachtrij-info">
              <div class="wachtrij-titel">Chanel ${o.titel}</div>
              <div class="wachtrij-meta">${o.nr} &middot; ${eur(o.prijs)} &middot; ${o.verkoper} &middot; ${o.wacht}</div>
            </div>
            ${['AWAITING_ITEM', 'SHIPPED_TO_BUYER'].includes(o.fase)
              ? `<span class="track">${trackCode(o.nr)}</span>`
              : `<span class="status-chip ${o.chipKlasse || ''}">${f.titel}</span>`}
          </div>`).join('')}
        ${totaal === 0 ? `<div class="fase-leeg">Nothing in this phase</div>` : ''}
        <p class="biedregel" style="margin-top:8px">${f.uitleg}</p>
      </div>`;
  }).join('');

  // Vooraf: betaald, wachten tot de verkoper het pakket meegeeft
  const wachtBlok = order && order.status === 'PAID' ? `
    <div class="werkkaart" style="margin-bottom:26px">
      <div class="fase-kop actief" style="margin-bottom:10px"><span class="nr">0</span>Label sent, waiting for the seller</div>
      <div class="wachtrij-info" style="margin-bottom:10px">
        <div class="wachtrij-titel">Chanel ${order.item.titel} ${order.item.jaar}</div>
        <div class="wachtrij-meta">SI-2026-001 &middot; ${eur(order.item.prijs)} &middot; seller: ${order.item.verkoper}</div>
      </div>
      <div class="label-kaart">
        <b>Shipping label generated</b> and emailed to the seller.<br>
        Tracking code <span class="track goud">${trackCode('SI-2026-001-A')}</span> &middot; insured up to ${eur(order.item.prijs)}<br>
        As soon as the seller hands over the parcel, we and the buyer see the same scan.
      </div>
      <div class="stap-uitleg" style="margin:0">Go to <b>My account &rsaquo; As seller</b> to hand over the parcel.</div>
    </div>` : '';

  const afgerond = order && (order.afgekeurd || order.status === 'COMPLETED') ? `
    <div class="melding ${order.afgekeurd ? 'rood' : 'groen'}" style="margin-bottom:24px">
      ${order.afgekeurd
        ? 'Your demo order was rejected and returned to the seller; the buyer has been refunded in full.'
        : 'Your demo order is complete and paid out. Start the demo again from the Boutique for another round.'}
    </div>` : '';

  const geenOrder = !order ? `
    <div class="stap-uitleg" style="margin-bottom:24px">Acquire a piece in the <b>Boutique</b> to guide an order through these five phases yourself. The other pieces below show what the board looks like on a working day.</div>` : '';

  v.innerHTML = kop + geenOrder + afgerond + wachtBlok + bord;
}

function htmlPapertrail() {
  const regels = [
    ['13:42', 'Order', 'SI-2026-0139', 'Status changed', 'AWAITING_ITEM → ITEM_RECEIVED', 'Lotte'],
    ['13:41', 'Shipment', 'SI-2026-0139', 'Received', 'atelier intake scan', 'Lotte'],

// De werkkaart van de demo-order: per fase de juiste actie, met tracking en rapport
function werkkaart(f) {
  const it = order.item;
  const trackIn = trackCode('SI-2026-001-A');
  const trackUit = trackCode('SI-2026-001-B');
  let inhoud = '';

  if (f.key === 'AWAITING_ITEM') {
    inhoud = `
      <div class="label-kaart">
        In transit with <span class="track goud">${trackIn}</span> &middot; last scan: sorting centre, today 07:12<br>
        The buyer sees the same tracking in their order.
      </div>
      <button class="knop" onclick="ontvangst()">Scan arrival &mdash; piece received</button>`;
  } else if (f.key === 'ITEM_RECEIVED') {
    inhoud = `
      <div class="stap-uitleg" style="margin-bottom:12px">Scanned in at ${order.binnenTijd || 'just now'}. Set aside for the expert.</div>
      <button class="knop" onclick="zetStatus('IN_INSPECTION','Expertise started. The buyer sees: your piece is being assessed.','koper')">Take into handling</button>`;
  } else if (f.key === 'IN_INSPECTION') {
    inhoud = `
      <div class="stap-uitleg" style="margin-bottom:14px"><b>Protocol:</b> hologram sticker and serial number &middot; stitching (seven per centimetre) &middot; hardware engravings &middot; leather structure and scent &middot; comparison with the listing photographs.</div>
      <div class="rapport-grid">
        <div class="rapport-veld"><label>Serial number</label><input id="rp-serie" value="${(it.serie || '').replace('Series ', '')}"></div>
        <div class="rapport-veld"><label>Condition after expertise</label>
          <select id="rp-conditie">${CONDITIES.map(c => `<option ${c === it.conditie ? 'selected' : ''}>${c}</option>`).join('')}</select>
        </div>
        <div class="rapport-veld"><label>Expert</label>
          <select id="rp-expert"><option>Lotte</option><option>Marieke</option><option>Youssef</option></select>
        </div>
      </div>
      <div class="rapport-veld"><label>Findings</label><input id="rp-notitie" placeholder="E.g. hologram intact, stitching correct, condition matches the listing"></div>
      <button class="knop groen" onclick="rondExpertiseAf(true)">Save report &mdash; approve</button>
      <button class="knop rood" onclick="rondExpertiseAf(false)">Save report &mdash; reject</button>`;
  } else if (f.key === 'APPROVED') {
    inhoud = `
      <div class="melding groen" style="margin:0 0 12px">Report saved: <b>${order.rapport ? order.rapport.conditie : it.conditie}</b>, found authentic by ${order.rapport ? order.rapport.expert : 'the atelier'}.${order.rapport && order.rapport.notitie ? ` &bdquo;${order.rapport.notitie}"` : ''}</div>
      <div class="label-kaart">
        On release we automatically generate the shipping label to the buyer:<br>
        <span class="track goud">${trackUit}</span> &middot; insured up to ${eur(it.prijs)} &middot; signature required
      </div>
      <button class="knop" onclick="verzendNaarKoper()">Generate label and release for dispatch</button>`;
  } else if (f.key === 'SHIPPED_TO_BUYER') {
    inhoud = `
      <div class="label-kaart">
        In transit with <span class="track goud">${trackUit}</span> &middot; the buyer has been emailed the same code.
      </div>
      <div class="stap-uitleg" style="margin:0">Go to the <b>Boutique</b> to simulate the delivery.</div>`;
  }

  return `
    <div class="werkkaart">
      <div style="display:flex;flex-wrap:wrap;gap:14px;align-items:center;margin-bottom:12px">
        <div class="mini-foto quilt">${art(it.art)}</div>
        <div class="wachtrij-info">
          <div class="wachtrij-titel">Chanel ${it.titel} ${it.jaar}</div>
          <div class="wachtrij-meta">SI-2026-001 &middot; ${eur(it.prijs)} &middot; seller: ${it.verkoper} &middot; your demo order</div>
        </div>
      </div>
      ${inhoud}
    </div>`;
}

function ontvangst() {
  order.binnenTijd = new Intl.DateTimeFormat('en-GB', { hour: '2-digit', minute: '2-digit' }).format(new Date());
  zetStatus('ITEM_RECEIVED', `Scanned in at ${order.binnenTijd}. <b>The buyer is notified: your piece has been received.</b>`, 'koper');
}

function rondExpertiseAf(goedgekeurd) {
  const veld = id => { const el = document.getElementById(id); return el ? el.value : ''; };
  order.rapport = { serie: veld('rp-serie'), conditie: veld('rp-conditie'), expert: veld('rp-expert'), notitie: veld('rp-notitie') };
  if (goedgekeurd) {
    zetStatus('APPROVED', 'Report saved and approved. <b>The buyer sees: found authentic.</b>', 'koper');
  } else {
    keurAf();
  }
}

function verzendNaarKoper() {
  zetStatus('SHIPPED_TO_BUYER', 'Label generated and dispatched. <b>The buyer has received the tracking code by email.</b>', 'koper');
}

function keurAf() {
  order.afgekeurd = true;
  order.status = 'REJECTED';
  toast('<b>Rejected.</b> The buyer is refunded in full; the piece is returned at the seller&rsquo;s expense.');
  notif('koper', true); notif('account', true);
  render();
}

// MIJN ACCOUNT — één persoon, twee petten (koper én verkoper)
// ─────────────────────────────────────────────────────────
const KOPER_STATUS_CHIP = {
  COMPLETED: { label: 'Completed', klasse: 'groen' },
  REFUNDED: { label: 'Refunded', klasse: 'rood' },
};

// Zijnavigatie per rol: sectie-sleutel, label en teller
function navSecties() {
  if (mijnRol === 'koper') {
    const lopend = order && !order.afgekeurd && order.status !== 'COMPLETED' ? 1 : 0;
    return [
      { groep: 'Actions', items: [
        { key: 'bestellingen', label: 'Orders in progress', telling: lopend, actie: lopend > 0 },
      ]},
      { groep: 'Overview', items: [
        { key: 'historie', label: 'Order history', telling: EERDERE_BESTELLINGEN.length },
        { key: 'favorieten', label: 'Wishlist', telling: wishlist.size },
        { key: 'mijn-biedingen', label: 'My offers', telling: biedVerstuurd ? 1 : 0 },
      ]},
      { groep: 'Administration', items: [
        { key: 'aankoopbonnen', label: 'Purchase receipts', telling: EERDERE_BESTELLINGEN.length },
        { key: 'gegevens', label: 'Details and addresses' },
      ]},
    ];
  }
  return [
    { groep: 'Actions', items: [
      { key: 'biedingen', label: 'Open offers', telling: openBiedingen.length, actie: openBiedingen.length > 0 },
      { key: 'verkoop', label: 'Sale in progress', telling: order && !order.afgekeurd && order.status !== 'COMPLETED' ? 1 : 0, actie: !!(order && order.status === 'PAID') },
    ]},
    { groep: 'Inventory', items: [
      { key: 'listings', label: 'Your listings', telling: ITEMS.filter(i => i.verkoper === 'Vera V.').length },
      { key: 'verkocht', label: 'Sold pieces', telling: EERDERE_VERKOPEN.length + (order && order.status === 'COMPLETED' && !order.afgekeurd ? 1 : 0) },
    ]},
    { groep: 'Administration', items: [
      { key: 'biedhistorie', label: 'Offer history', telling: biedHistorie.length },
      { key: 'facturen', label: 'Invoices', telling: EERDERE_VERKOPEN.length + (order && order.status === 'COMPLETED' && !order.afgekeurd ? 1 : 0) },
      { key: 'uitbetalingen', label: 'Payouts' },
      { key: 'gegevens', label: 'Details and KYC' },
    ]},
  ];
}

function kiesSectie(key) { accountSectie = key; accountDetail = null; verkochtDetail = null; render(); }

function renderAccount() {
  const v = document.getElementById('view-account');
  if (accountTab === 'berichten') { v.innerHTML = htmlBerichten(); return; }
  if (accountTab === 'support')   { v.innerHTML = htmlSupport(); return; }
  const secties = navSecties();
  const alleKeys = secties.flatMap(g => g.items.map(i => i.key));
  if (!alleKeys.includes(accountSectie)) accountSectie = alleKeys[0];

  const nav = secties.map(g => `
    <div class="nav-groep">
      <div class="nav-groep-kop">${g.groep}</div>
      ${g.items.map(i => `
        <button class="nav-item ${accountSectie === i.key ? 'actief' : ''}" onclick="kiesSectie('${i.key}')">
          <span>${i.label}</span>
          ${i.telling !== undefined ? `<span class="nav-badge ${i.actie ? '' : 'stil'}">${i.telling}</span>` : ''}
        </button>`).join('')}
    </div>`).join('');

  const kop = `
    <div class="centreer intro" style="margin-bottom:22px">
      <div class="voorregel">My Account</div>
      <h2 class="kop">Vera V.</h2>
      <p class="sub">Private account &middot; identity verified through Stripe</p>
    </div>
    <div class="wisselaar">
      <button class="wissel-knop ${mijnRol === 'koper' ? 'actief' : ''}" onclick="mijnRol='koper';accountSectie=null;accountDetail=null;render()">As buyer</button>
      <button class="wissel-knop ${mijnRol === 'verkoper' ? 'actief' : ''}" onclick="mijnRol='verkoper';accountSectie=null;accountDetail=null;render()">As seller</button>
    </div>`;

  v.innerHTML = kop + `
    <div class="account-layout">
      <nav class="account-nav">${nav}</nav>
      <div class="account-inhoud">${mijnRol === 'koper' ? htmlAccountKoper() : htmlAccountVerkoper()}</div>
    </div>`;
}

// ── Koperzijde: bestellingenlijst met duidelijke status ──
function htmlAccountKoper() {
  if (accountDetail) {
    const b = EERDERE_BESTELLINGEN.find(x => x.id === accountDetail);
    if (b) return htmlEerdereBestelling(b);
  }

  const rijen = [];
  if (order) {
    const stap = STAPPEN.find(s => s.key === order.status);
    const idx = statusIndex();
    const chip = order.afgekeurd
      ? '<span class="status-chip rood">Refund on its way</span>'
      : `<span class="status-chip ${order.status === 'COMPLETED' ? 'groen' : ''}">${stap ? stap.titel : ''}</span>`;
    rijen.push(`
      <div class="wachtrij-item" style="cursor:pointer" onclick="scherm='tracking';toonRol('koper')">
        <div class="mini-foto quilt">${art(order.item.art)}</div>
        <div class="wachtrij-info">
          <div class="wachtrij-titel">Chanel ${order.item.titel} ${order.item.jaar}</div>
          <div class="wachtrij-meta">Order N&deg; SI-2026-001 &middot; ${eur(order.item.prijs)} &middot; ${order.afgekeurd ? 'expertise negative, you will be refunded in full' : `step ${idx + 1} of ${STAPPEN.length} &middot; click for the full tracking`}</div>
        </div>
        ${chip}
      </div>`);
  }
  for (const b of EERDERE_BESTELLINGEN) {
    const chip = KOPER_STATUS_CHIP[b.status];
    rijen.push(`
      <div class="wachtrij-item" style="cursor:pointer" onclick="accountDetail='${b.id}';render()">
        <div class="mini-foto quilt">${art(b.art)}</div>
        <div class="wachtrij-info">
          <div class="wachtrij-titel">Chanel ${b.titel} ${b.jaar}</div>
          <div class="wachtrij-meta">${b.datum} &middot; ${eur(b.prijs)}</div>
        </div>
        <span class="status-chip ${chip.klasse}">${chip.label}</span>
      </div>`);
  }

  const lopend = rijen.length - EERDERE_BESTELLINGEN.length;

  if (accountSectie === 'historie') {
    return `
      <div class="sectiekop">Order history (${EERDERE_BESTELLINGEN.length})</div>
      ${rijen.slice(lopend).join('')}
      <p class="biedregel">Click an order for the full timeline and how it was handled.</p>`;
  }
  if (accountSectie === 'favorieten') {
    const favs = ITEMS.filter(i => wishlist.has(i.id));
    return `
      <div class="sectiekop">Wishlist (${favs.length})</div>
      ${favs.length === 0
        ? `<div class="stap-uitleg">Your wishlist is empty. Save pieces in the <b>Boutique</b> using the diamond in the corner of each card.</div>`
        : favs.map(f => {
            const weg = order && order.item.id === f.id;
            return `
        <div class="wachtrij-item" style="cursor:pointer" onclick="naarDetail(${ITEMS.indexOf(f)})">
          <div class="mini-foto quilt">${art(f.art)}</div>
          <div class="wachtrij-info">
            <div class="wachtrij-titel">Chanel ${f.titel} ${f.jaar}</div>
            <div class="wachtrij-meta">${eur(f.prijs)} &middot; ${f.conditie} &middot; ${weg ? 'no longer available' : 'still available'}</div>
          </div>
          <button class="knop klein sec" onclick="toggleWish(${f.id}, event)">Remove</button>
        </div>`;
          }).join('')}
      <p class="biedregel">We notify you when the price drops, when someone else makes an offer, or when a piece is sold.</p>`;
  }
  if (accountSectie === 'mijn-biedingen') {
    return `
      <div class="sectiekop">My offers</div>
      ${biedVerstuurd
        ? `<div class="melding">Your offer of <b>${eur(biedVerstuurd)}</b> on Chanel ${kijkItem ? kijkItem.titel : ''} is still open. The seller has 48 hours to respond.</div>`

// ── Berichten: altijd gekoppeld aan een stuk of order ──
function htmlBerichten() {
  const kop = `
    <div class="centreer intro" style="margin-bottom:22px">
      <div class="voorregel">Messages</div>
      <h2 class="kop">Your conversations</h2>
      <p class="sub">Every conversation is attached to a piece or an order, so you never have to search for what it was about. Our atelier writes in the same thread.</p>
    </div>`;

  if (openGesprek) {
    const g = GESPREKKEN.find(x => x.id === openGesprek);
    return kop + `
      <button class="terug" onclick="openGesprek=null;render()">&larr; All conversations</button>
      <div class="paneel">
        <div class="gesprek-kop" style="border-bottom:1px solid var(--lijn);padding-bottom:12px;margin-bottom:6px">
          <div>
            <div class="gesprek-naam">${g.met}</div>
            <div class="gesprek-over">${g.rol} &middot; about ${g.over}</div>
          </div>
          <button class="knop klein sec" onclick="toast('Opens the piece or the order this conversation belongs to.')">View piece</button>
        </div>

        <div class="veilig-kader">
          <b>Keep the conversation on the platform.</b> Never pay outside Still Iconic: only through us does your money stay protected, the piece authenticated and the conversation kept as evidence. We never ask for your bank details.
        </div>

        <div class="bubbels">
          ${g.berichten.map(b => b.van === 'systeem'
            ? `<div class="bubbel systeem">${b.tekst}<span class="tijd">${b.tijd}</span></div>`
            : `<div class="bubbel ${b.van === 'ik' ? 'ik' : 'hun'}">${b.tekst}<span class="tijd">${b.tijd}</span></div>`).join('')}
        </div>

        <div class="snelantwoorden">
          ${['Thank you for your message.', 'I can confirm that.', 'The condition report is on the listing.', 'I will send you a counter-offer.'].map(s =>
            `<button class="snelantwoord" onclick="vulAntwoord('${s}')">${s}</button>`).join('')}
        </div>
        <div class="bericht-balk">
          <textarea id="antwoordveld" placeholder="Write a message..."></textarea>
          <button class="knop" onclick="verstuurBericht('${g.id}')">Send</button>
        </div>
        <p class="biedregel">Messages are kept with the order; our team can read along in a dispute.</p>
      </div>`;
  }

  return kop + `
    <div class="gesprek-lijst">
      ${GESPREKKEN.map(g => {
        const laatste = g.berichten[g.berichten.length - 1];
        return `
        <button class="gesprek ${g.ongelezen ? 'ongelezen' : ''}" onclick="openGesprek='${g.id}';markeerGelezen('${g.id}')">
          <div style="flex:1">
            <div class="gesprek-kop">
              <span class="gesprek-naam">${g.met}</span>
              <span class="gesprek-tijd">${g.tijd}</span>
            </div>
            <div class="gesprek-over">${g.rol} &middot; ${g.over}</div>
            <div class="gesprek-laatste">${laatste.van === 'ik' ? 'You: ' : ''}${laatste.tekst}</div>
          </div>
          ${g.ongelezen ? '<span class="status-chip">New</span>' : ''}
        </button>`;
      }).join('')}
    </div>
    <p class="biedregel">New conversations arise on their own: from a question about a piece, an offer, or as soon as your order arrives at the atelier.</p>`;
}

function markeerGelezen(id) {
  const g = GESPREKKEN.find(x => x.id === id);
  if (g) g.ongelezen = false;
  render();
}
function vulAntwoord(tekst) {
  const veld = document.getElementById('antwoordveld');
  if (veld) { veld.value = tekst; veld.focus(); }
}
function verstuurBericht(id) {
  const veld = document.getElementById('antwoordveld');
  const tekst = veld && veld.value.trim();
  if (!tekst) { toast('Write a message first.'); return; }
  const g = GESPREKKEN.find(x => x.id === id);
  g.berichten.push({ van: 'ik', tekst, tijd: 'just now' });
  toast('Message sent and kept with the order.');
  render();
}

// ── Verkoperzijde: uitgewerkt dashboard ──
function htmlAccountVerkoper() {
  if (verkochtDetail !== null && EERDERE_VERKOPEN[verkochtDetail]) {
    return htmlVerkochtDetail(EERDERE_VERKOPEN[verkochtDetail]);
  }

  // ACTIE-INBOX: openstaande biedingen, prominent bovenaan.
  // Hier moet de verkoper handelen; al het andere is administratie.
  const openBlok = `
    <div class="paneel" style="border-color:var(--goud);border-left-width:3px">
      <div class="sectiekop">Open offers (${openBiedingen.length}) &mdash; action required</div>
      ${openBiedingen.length === 0 ? `
        <p class="sub" style="margin:0 0 14px">No open offers. New offers appear here immediately, with a notification.</p>
        <button class="knop klein sec" onclick="simuleerBod()">Simulate an incoming offer</button>` :
      openBiedingen.map(b => `
        <div style="border:1px solid var(--lijn);padding:16px 18px;margin-bottom:12px">
          <div style="display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;align-items:baseline">
            <div>
              <span style="font-family:var(--serif);font-size:20px">${eur(b.bedrag)}</span>
              <span class="biedregel" style="margin:0"> from ${b.bieder} on Chanel ${b.stuk}</span>
            </div>
            <span class="status-chip">${b.verloopt}</span>
          </div>
          <div class="biedregel" style="margin:4px 0 12px">Asking price ${eur(b.vraagprijs)} &middot; this offer is ${Math.round(b.bedrag / b.vraagprijs * 100)}% of your asking price</div>
          <button class="knop groen klein" onclick="bodActie('${b.id}','accepteer')">Accept</button>
          <button class="knop klein" onclick="bodActie('${b.id}','tegenbod')">Counter-offer ${eur(Math.round((b.bedrag + b.vraagprijs) / 2 / 50) * 50)}</button>
          <button class="knop rood klein" onclick="bodActie('${b.id}','afwijzen')">Decline</button>
        </div>`).join('')}
    </div>`;

  // Listings van Vera in de collectie
  const mijnListings = ITEMS.filter(it => it.verkoper === 'Vera V.');
  const listingsBlok = `
    <div class="paneel">
      <div class="sectiekop">Your listings</div>
      ${mijnListings.map(it => {
        const verkocht = order && order.item.id === it.id && !order.afgekeurd;
        return `
        <div class="wachtrij-item" style="border:none;padding:10px 0;margin:0;cursor:pointer" onclick="naarDetail(${ITEMS.indexOf(it)})">
          <div class="mini-foto quilt" style="width:48px;height:48px">${art(it.art)}</div>
          <div class="wachtrij-info">
            <div style="font-family:var(--serif);font-size:15px">Chanel ${it.titel} ${it.jaar}</div>
            <div class="wachtrij-meta">${eur(it.prijs)} &middot; ${it.conditie} &middot; view in the boutique</div>
          </div>
          <span class="status-chip ${verkocht ? 'groen' : ''}">${verkocht ? 'Sold' : 'For sale'}</span>
        </div>`;
      }).join('')}
      <p class="biedregel" style="margin-top:8px">Click a piece to view the listing. In the real platform you also manage drafts and withdrawn pieces here.</p>
    </div>`;

  // Verkochte stukken: historie + de lopende verkoop zodra afgerond
  const liveNetto = order ? order.item.prijs * (1 - VERKOPERSFEE) - 9.5 : 0;
  const liveAfgerond = order && order.status === 'COMPLETED' && !order.afgekeurd;
  const verkochtRijen = [
    ...(liveAfgerond ? [`
      <div class="wachtrij-item" style="border:none;padding:10px 0;margin:0">
        <div class="mini-foto quilt" style="width:48px;height:48px">${art(order.item.art)}</div>
        <div class="wachtrij-info">
          <div style="font-family:var(--serif);font-size:15px">Chanel ${order.item.titel} ${order.item.jaar}</div>
          <div class="wachtrij-meta">today &middot; sold for ${eur(order.item.prijs)} &middot; net ${eur(liveNetto)}</div>
        </div>
        <span class="status-chip groen">Paid out</span>
      </div>`] : []),
    ...EERDERE_VERKOPEN.map((vk, i) => `
      <div class="wachtrij-item" style="border:none;padding:10px 0;margin:0;cursor:pointer" onclick="verkochtDetail=${i};render()">
        <div class="mini-foto quilt" style="width:48px;height:48px">${art(vk.art)}</div>
        <div class="wachtrij-info">
          <div style="font-family:var(--serif);font-size:15px">Chanel ${vk.titel}</div>
          <div class="wachtrij-meta">${vk.datum} &middot; sold for ${eur(vk.prijs)} &middot; net ${eur(vk.netto)}</div>
        </div>
        <span class="status-chip groen">Paid out</span>
      </div>`),
  ];
  const totaalUitbetaald = EERDERE_VERKOPEN.reduce((s, vk) => s + vk.netto, 0) + (liveAfgerond ? liveNetto : 0);
  const verkochtBlok = `
    <div class="paneel">
      <div class="sectiekop">Sold pieces (${verkochtRijen.length})</div>
      ${verkochtRijen.join('')}
      <div class="bon" style="margin:8px 0 0"><div class="bon-rij totaal" style="padding-top:10px"><span class="oms">Total paid out</span><span>${eur(totaalUitbetaald)}</span></div></div>
      <p class="biedregel">Payout straight through Stripe as soon as the buyer confirms receipt. No batches, no waiting times.</p>
    </div>`;

  // Biedhistorie: eerdere biedingen + de lopende bied-simulatie
  const biedRijen = biedHistorie;
  const biedBlok = `
    <div class="paneel">
      <div class="sectiekop">Offer history (${biedRijen.length})</div>
      <div class="bon">
        ${biedRijen.map(b => `
        <div class="bon-rij">
          <span class="oms">${b.datum} &middot; <b>${eur(b.bedrag)}</b> from ${b.bieder} on ${b.stuk}</span>
          <span style="font-family:var(--sans);font-size:11px;color:${b.status.includes('ccepted') ? 'var(--groen)' : b.status === 'Declined' ? 'var(--bordeaux)' : 'var(--grijs)'}">${b.status}</span>
        </div>`).join('')}
      </div>
      <p class="biedregel">Every offer is valid for 48 hours and is recorded in the audit trail: amount, bidder, outcome and time.</p>
    </div>`;

  // Facturen: commissienota's per verkoop (particuliere verkoper: alleen fee-facturen)
  const factuurRijen = [
    ...(liveAfgerond ? [`
      <div class="bon-rij" style="cursor:pointer" onclick="toast('In the real platform you download the PDF here.')">
        <span class="oms">TM-F-2026-0198 &middot; today &middot; commission note Chanel ${order.item.titel}</span>
        <span>${eur(order.item.prijs * VERKOPERSFEE + 9.5)}</span>
      </div>`] : []),
    ...EERDERE_VERKOPEN.map(vk => `
      <div class="bon-rij" style="cursor:pointer" onclick="toast('In the real platform you download the PDF here.')">
        <span class="oms">${vk.factuur} &middot; ${vk.datum} &middot; commission note Chanel ${vk.titel}</span>
        <span>${eur(vk.prijs - vk.netto)}</span>
      </div>`),
  ];
  const facturenBlok = `
    <div class="paneel">
      <div class="sectiekop">Invoices</div>
      <div class="bon">${factuurRijen.join('')}</div>
      <p class="biedregel">As a private seller you only receive commission notes from the maison (incl. 21% VAT on the fee). Business sellers also see the sales invoices the platform issues on their behalf under the margin scheme.</p>
    </div>`;

  // Sectiekeuze uit de zijnavigatie
  if (accountSectie === 'biedingen') return openBlok;
  if (accountSectie === 'listings') return listingsBlok;
  if (accountSectie === 'verkocht') return verkochtBlok;
  if (accountSectie === 'biedhistorie') return biedBlok;
  if (accountSectie === 'facturen') return facturenBlok;
  if (accountSectie === 'gegevens') return htmlGegevens();
  if (accountSectie === 'uitbetalingen') return `
    <div class="sectiekop">Payouts</div>
    <div class="paneel" style="margin:0">
      <div class="bon">
        ${(liveAfgerond ? [`<div class="bon-rij"><span class="oms">today &middot; Chanel ${order.item.titel}</span><span style="color:var(--groen)"><b>${eur(liveNetto)}</b></span></div>`] : []).join('')}
        ${EERDERE_VERKOPEN.map(vk => `<div class="bon-rij"><span class="oms">${vk.datum} &middot; Chanel ${vk.titel}</span><span>${eur(vk.netto)}</span></div>`).join('')}
        <div class="bon-rij totaal"><span class="oms">Total paid out</span><span>${eur(totaalUitbetaald)}</span></div>
      </div>
      <dl class="specs" style="margin:14px 0 0">
        <div class="spec"><dt>Account</dt><dd>NL** INGB **** **89 &middot; verified</dd></div>
        <div class="spec"><dt>Timing</dt><dd>Straight after confirmed delivery</dd></div>
      </dl>
      <p class="biedregel">Payout straight through Stripe, without batches or waiting times.</p>
    </div>`;

  // Standaard: lopende verkoop
  if (!order) {
    return `
      <div class="sectiekop">Sale in progress</div>
      <div class="paneel leeg" style="padding:30px;margin:0">
        <div class="orn">&#9670;&#9670;&#9670;</div>
        <p>No sale in progress.<br>Acquire a piece as a <b>buyer</b> in the Boutique to experience the selling flow.</p>
      </div>`;
  }

  const it = order.item;
  const netto = it.prijs * (1 - VERKOPERSFEE) - RETOURKOSTEN * 0 - 9.5;
  let inhoud = '';

  if (order.afgekeurd) {
    inhoud = `
      <div class="melding rood"><b>Expertise negative.</b> The piece is being returned; the return costs (${eur(RETOURKOSTEN)}) are at your expense. The sale does not go ahead.</div>
      <button class="knop sec klein" onclick="resetDemo()">Restart the demo</button>`;
  } else if (order.status === 'PAID') {
    inhoud = `
      <div class="melding"><b>Sold.</b> Chanel ${it.titel} ${it.jaar} for ${eur(it.prijs)}. Your insured shipping label is ready.</div>
      <div class="bon">
        <div class="bon-rij"><span class="oms">Sale price</span><span>${eur(it.prijs)}</span></div>
        <div class="bon-rij"><span class="oms">Commission of the maison (10%)</span><span>&minus; ${eur(it.prijs * VERKOPERSFEE)}</span></div>
        <div class="bon-rij"><span class="oms">Shipping to the atelier</span><span>&minus; € 9.50</span></div>
        <div class="bon-rij totaal"><span class="oms">Your payout after delivery</span><span>${eur(netto)}</span></div>
      </div>
      <button class="knop goud" onclick="zetStatus('AWAITING_ITEM','The parcel is on its way to the atelier.','atelier')">Label printed &mdash; parcel handed over</button>`;
  } else if (order.status === 'COMPLETED') {
    inhoud = `
      <div class="melding groen"><b>Paid out: ${eur(netto)}</b> &mdash; transferred straight through Stripe as soon as the buyer confirmed receipt. No waiting times, no batches.</div>
      <button class="knop sec klein" onclick="resetDemo()">Restart the demo</button>`;
  } else {
    const stap = STAPPEN.find(s => s.key === order.status);
    const groenChip = ['APPROVED', 'SHIPPED_TO_BUYER', 'DELIVERED'].includes(order.status);
    inhoud = `
      <div class="wachtrij-item" style="border:none;padding:0;margin-bottom:18px">
        <div class="mini-foto quilt">${art(it.art)}</div>
        <div class="wachtrij-info">
          <div class="wachtrij-titel">Chanel ${it.titel} ${it.jaar}</div>
          <div class="wachtrij-meta">Expected payout: ${eur(netto)}</div>
        </div>
        <span class="status-chip ${groenChip ? 'groen' : ''}">${stap ? stap.titel : ''}</span>
      </div>
      <div class="stap-uitleg" style="margin:0">Nothing is needed from you. The atelier and the buyer take the next steps; switch roles to carry them out.</div>`;
  }

  return `<div class="sectiekop">Sale in progress</div><div class="paneel" style="margin:0">${inhoud}</div>`;
}

function resetDemo() {
  order = null; kijkItem = null; scherm = 'browse'; accountDetail = null;
  biedOpen = false; biedVerstuurd = null; fotoView = 0; checkoutUpgrade = null;
  openBiedingen = [
    { id: 'B1', stuk: 'Deauville Tote Large 2017', bieder: 'Mika S.', bedrag: 1550, vraagprijs: 1750, verloopt: 'expires in 11 hours' },
  ];
  biedHistorie = [...EERDERE_BIEDINGEN];
  ['koper', 'atelier', 'account'].forEach(r => notif(r, false));
  toast('The demo has been reset. Acquire a piece again to start the flow.');
  render();
}

function render() { renderKoper(); renderAtelier(); renderAccount(); renderHoofdnav(); }
render();
</script>
