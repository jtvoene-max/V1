<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Timeless — La Maison de la Revente</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=Geist:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --noir: #0a0a0a;
    --ivoor: #fafafa;
    --wit: #ffffff;
    --champagne: #d8c49a;
    --goud: #a8894f;
    --goud-diep: #8a6f3c;
    --inkt: #1a1a1a;
    --grijs: #767676;
    --lijn: rgba(10, 10, 10, .14);
    --lijn-goud: rgba(168, 137, 79, .35);
    --groen: #3e5c46;
    --bordeaux: #7a3b3b;
    /* Zelfde typografie als de echte app: Playfair Display + Geist */
    --serif: "Playfair Display", "Bodoni MT", Georgia, serif;
    --sans: "Geist", "Helvetica Neue", Helvetica, "Segoe UI", Arial, sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    font-family: var(--serif);
    background: var(--ivoor);
    color: var(--inkt);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  /* ─── Matelassé-ruitpatroon ─── */
  .quilt {
    background-color: #f6f6f5;
    background-image:
      linear-gradient(45deg,  transparent 48.5%, rgba(10,10,10,.07) 48.5%, rgba(10,10,10,.07) 51.5%, transparent 51.5%),
      linear-gradient(-45deg, transparent 48.5%, rgba(10,10,10,.07) 48.5%, rgba(10,10,10,.07) 51.5%, transparent 51.5%);
    background-size: 46px 46px;
  }
  .quilt-donker {
    background-color: var(--noir);
    background-image:
      linear-gradient(45deg,  transparent 48%, rgba(255,255,255,.07) 48%, rgba(255,255,255,.07) 52%, transparent 52%),
      linear-gradient(-45deg, transparent 48%, rgba(255,255,255,.07) 48%, rgba(255,255,255,.07) 52%, transparent 52%);
    background-size: 54px 54px;
  }

  /* ─── Maison-kop ─── */
  .maison {
    color: var(--ivoor);
    text-align: center;
    padding: 40px 20px 34px;
    position: relative;
  }
  .maison-naam {
    font-size: 34px;
    letter-spacing: .42em;
    text-transform: uppercase;
    font-weight: 400;
    text-indent: .42em;
  }
  .maison-naam .amp { color: var(--champagne); }
  .maison-sub {
    font-family: var(--sans);
    font-size: 10px;
    letter-spacing: .38em;
    text-transform: uppercase;
    color: rgba(255,255,255,.55);
    margin-top: 12px;
    text-indent: .38em;
  }
  .maison-lijn {
    width: 54px; height: 1px;
    background: var(--goud);
    margin: 16px auto 0;
  }
  .demo-chip {
    position: absolute; top: 14px; right: 16px;
    font-family: var(--sans);
    font-size: 9px; letter-spacing: .22em; text-transform: uppercase;
    color: rgba(255,255,255,.6);
    border: 1px solid rgba(255,255,255,.25);
    padding: 6px 12px;
  }

  /* ─── Rol-navigatie ─── */
  .roltabs {
    display: flex;
    justify-content: center;
    gap: 0;
    background: var(--wit);
    border-bottom: 1px solid var(--lijn);
    position: sticky; top: 0; z-index: 20;
  }
  .roltab {
    font-family: var(--sans);
    font-size: 11px;
    letter-spacing: .26em;
    text-transform: uppercase;
    color: var(--grijs);
    background: none; border: none;
    padding: 20px 34px 17px;
    cursor: pointer;
    border-bottom: 1px solid transparent;
    transition: color .2s;
    position: relative;
  }
  .roltab:hover { color: var(--inkt); }
  .roltab.actief { color: var(--inkt); border-bottom-color: var(--goud); }
  .roltab .notif {
    position: absolute; top: 12px; right: 14px;
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--goud);
    display: none;
    animation: notifpols 1.6s infinite;
  }
  @keyframes notifpols {
    0%, 100% { box-shadow: 0 0 0 0 rgba(168,137,79,.45); }
    55% { box-shadow: 0 0 0 6px rgba(168,137,79,0); }
  }

  .view { display: none; max-width: 1000px; margin: 0 auto; padding: 46px 24px 90px; animation: fade .35s ease; }
  .view.actief { display: block; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  /* ─── Typografie ─── */
  h2.kop { font-size: 30px; font-weight: 400; letter-spacing: .02em; }
  .voorregel {
    font-family: var(--sans);
    font-size: 10px; letter-spacing: .34em; text-transform: uppercase;
    color: var(--grijs); margin-bottom: 10px;
  }
  .sub { font-family: var(--sans); font-size: 13px; color: var(--grijs); margin-top: 10px; line-height: 1.7; }
  .centreer { text-align: center; }
  .intro { max-width: 520px; margin: 0 auto 44px; }

  /* ─── Collectie ─── */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 26px; }
  .kaart {
    background: var(--wit);
    border: 1px solid var(--lijn);
    cursor: pointer;
    transition: box-shadow .25s, transform .25s;
  }
  .kaart:hover { transform: translateY(-4px); box-shadow: 0 18px 44px rgba(12,11,9,.10); }
  .kaart-foto {
    aspect-ratio: 1;
    display: flex; align-items: center; justify-content: center;
    border-bottom: 1px solid var(--lijn);
    color: var(--noir);
  }
  .kaart-foto svg { width: 58%; height: 58%; }
  .kaart-info { padding: 18px 20px 22px; text-align: center; }
  .kaart-titel { font-size: 16px; letter-spacing: .02em; }
  .kaart-meta {
    font-family: var(--sans); font-size: 9.5px; letter-spacing: .2em; text-transform: uppercase;
    color: var(--grijs); margin: 8px 0 10px;
  }
  .kaart-prijs { font-size: 17px; color: var(--inkt); }
  .kaart-prijs.verkocht { font-family: var(--sans); font-size: 10px; letter-spacing: .3em; text-transform: uppercase; color: var(--grijs); }
  .verkocht-overlay { opacity: .5; pointer-events: none; }

  /* ─── Panelen ─── */
  .paneel { background: var(--wit); border: 1px solid var(--lijn); padding: 40px; margin-bottom: 24px; }
  .terug {
    font-family: var(--sans); font-size: 10px; letter-spacing: .26em; text-transform: uppercase;
    color: var(--grijs); background: none; border: none; cursor: pointer;
    margin-bottom: 22px; padding: 0;
  }
  .terug:hover { color: var(--inkt); }

  .detail-flex { display: flex; gap: 44px; flex-wrap: wrap; }
  .detail-foto {
    flex: 1; min-width: 280px; aspect-ratio: 1;
    display: flex; align-items: center; justify-content: center;
    border: 1px solid var(--lijn);
    color: var(--noir);
  }
  .detail-foto svg { width: 55%; height: 55%; }
  .detail-info { flex: 1.1; min-width: 300px; }
  .detail-prijs { font-size: 30px; margin: 18px 0 26px; }

  .specs { margin: 26px 0; }
  .spec {
    display: flex; justify-content: space-between; gap: 20px;
    padding: 11px 0; border-bottom: 1px solid var(--lijn);
    font-size: 15px;
  }
  .spec:first-child { border-top: 1px solid var(--lijn); }
  .spec dt {
    font-family: var(--sans); font-size: 9.5px; letter-spacing: .22em; text-transform: uppercase;
    color: var(--grijs); padding-top: 4px; white-space: nowrap;
  }
  .spec dd { text-align: right; }
  .goudtekst { color: var(--grijs); }

  /* ─── Knoppen ─── */
  .knop {
    font-family: var(--sans);
    font-size: 10.5px; letter-spacing: .28em; text-transform: uppercase;
    background: var(--noir); color: var(--ivoor);
    border: 1px solid var(--noir);
    padding: 16px 34px;
    cursor: pointer;
    transition: background .2s, color .2s, border-color .2s;
    margin: 4px 8px 4px 0;
  }
  .knop:hover { background: var(--wit); color: var(--noir); }
  .knop.goud { background: var(--noir); border-color: var(--noir); color: var(--champagne); }
  .knop.goud:hover { background: var(--wit); }
  .knop.sec { background: transparent; color: var(--inkt); border-color: var(--inkt); }
  .knop.sec:hover { background: var(--noir); color: var(--wit); }
  .knop.groen { background: var(--groen); border-color: var(--groen); }
  .knop.groen:hover { background: var(--noir); border-color: var(--noir); }
  .knop.rood { background: transparent; color: var(--bordeaux); border-color: var(--bordeaux); }
  .knop.rood:hover { background: var(--bordeaux); color: var(--ivoor); }
  .knop.blok { width: 100%; margin: 0; }
  .knop.klein { padding: 11px 20px; font-size: 9.5px; }

  /* ─── Checkout ─── */
  .bon { font-size: 15px; margin: 8px 0 26px; }
  .bon-rij { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--lijn); }
  .bon-rij .oms { font-family: var(--sans); font-size: 12px; color: var(--grijs); letter-spacing: .04em; }
  .bon-rij.totaal { border-bottom: none; padding-top: 18px; font-size: 19px; }
  .bon-rij.totaal .oms { font-family: var(--sans); font-size: 10px; letter-spacing: .28em; text-transform: uppercase; color: var(--inkt); padding-top: 6px; }
  .betaalopties { display: flex; gap: 10px; margin: 22px 0 26px; flex-wrap: wrap; }
  .betaaloptie {
    font-family: var(--sans); font-size: 10px; letter-spacing: .18em; text-transform: uppercase;
    border: 1px solid var(--lijn); background: var(--wit);
    padding: 13px 20px; cursor: pointer; color: var(--grijs);
    transition: all .15s;
  }
  .betaaloptie:hover { border-color: var(--noir); color: var(--inkt); }
  .betaaloptie.gekozen { border-color: var(--noir); color: var(--inkt); background: var(--ivoor); }

  /* ─── Tijdlijn ─── */
  .tijdlijn { list-style: none; margin: 34px 0 10px; }
  .tijdlijn li { display: flex; gap: 24px; position: relative; padding-bottom: 30px; }
  .tijdlijn li::before {
    content: ''; position: absolute; left: 17px; top: 38px; bottom: 2px;
    width: 1px; background: var(--lijn);
  }
  .tijdlijn li.klaar::before { background: var(--noir); }
  .tijdlijn li:last-child::before { display: none; }
  .stip {
    width: 35px; height: 35px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--serif); font-size: 14px;
    border: 1px solid var(--lijn); color: var(--grijs); background: var(--wit);
  }
  li.klaar .stip { background: var(--noir); border-color: var(--noir); color: var(--champagne); }
  li.nu .stip { border-color: var(--goud); color: var(--goud-diep); animation: pols 1.8s infinite; }
  @keyframes pols {
    0%, 100% { box-shadow: 0 0 0 0 rgba(168,137,79,.35); }
    55% { box-shadow: 0 0 0 9px rgba(168,137,79,0); }
  }
  li:not(.klaar):not(.nu) { opacity: .38; }
  .stap-titel { font-size: 17px; padding-top: 5px; }
  li.nu .stap-titel { color: var(--goud-diep); }
  .stap-toel { font-family: var(--sans); font-size: 12px; color: var(--grijs); margin-top: 5px; line-height: 1.65; max-width: 460px; }

  /* ─── Atelier / meldingen ─── */
  .wachtrij-item {
    display: flex; align-items: center; gap: 22px;
    background: var(--wit); border: 1px solid var(--lijn);
    padding: 22px 26px; margin-bottom: 20px;
  }
  .mini-foto {
    width: 64px; height: 64px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    border: 1px solid var(--lijn); color: var(--noir);
  }
  .mini-foto svg { width: 62%; height: 62%; }
  .wachtrij-info { flex: 1; }
  .wachtrij-titel { font-size: 17px; }
  .wachtrij-meta { font-family: var(--sans); font-size: 11px; color: var(--grijs); margin-top: 4px; letter-spacing: .04em; }
  .status-chip {
    font-family: var(--sans); font-size: 9px; letter-spacing: .24em; text-transform: uppercase;
    color: var(--inkt); border: 1px solid var(--lijn);
    padding: 7px 14px; white-space: nowrap;
  }
  .status-chip.groen { color: var(--groen); border-color: rgba(74,107,82,.4); }
  .status-chip.rood { color: var(--bordeaux); border-color: rgba(122,59,59,.4); }

  .melding {
    font-family: var(--sans); font-size: 12.5px; line-height: 1.7;
    border: 1px solid var(--lijn);
    border-left: 3px solid var(--goud);
    background: #f7f7f6;
    padding: 16px 20px; margin-bottom: 22px;
  }
  .melding b { letter-spacing: .02em; }
  .melding.rood { border-color: rgba(122,59,59,.35); border-left-color: var(--bordeaux); background: rgba(122,59,59,.06); }
  .melding.groen { border-color: rgba(74,107,82,.35); border-left-color: var(--groen); background: rgba(74,107,82,.07); }
  .melding a { color: var(--inkt); }
  .stap-uitleg {
    font-family: var(--sans); font-size: 12px; color: var(--grijs); line-height: 1.7;
    border: 1px dashed var(--lijn);
    padding: 14px 18px; margin-bottom: 22px;
  }
  .stap-uitleg b { color: var(--inkt); }
  .leeg { text-align: center; padding: 46px 20px; }
  .leeg .orn { color: var(--goud); font-size: 22px; letter-spacing: .5em; text-indent: .5em; margin-bottom: 18px; }
  .leeg p { font-family: var(--sans); font-size: 13px; color: var(--grijs); line-height: 1.8; }
  .leeg b { color: var(--inkt); }

  .sectiekop {
    font-family: var(--sans); font-size: 10px; letter-spacing: .32em; text-transform: uppercase;
    color: var(--grijs); margin-bottom: 18px;
    display: flex; align-items: center; gap: 14px;
  }
  .sectiekop::after { content: ''; flex: 1; height: 1px; background: var(--lijn); }

  /* ─── Toast ─── */
  #toast {
    position: fixed; bottom: 28px; left: 50%;
    transform: translateX(-50%) translateY(90px);
    background: var(--noir); color: var(--ivoor);
    font-family: var(--sans); font-size: 12px; letter-spacing: .04em; line-height: 1.6;
    padding: 15px 28px;
    border: 1px solid rgba(255,255,255,.18);
    transition: transform .35s cubic-bezier(.2,.8,.2,1);
    z-index: 100; max-width: min(88vw, 480px); text-align: center;
    box-shadow: 0 14px 40px rgba(12,11,9,.35);
  }
  #toast.zichtbaar { transform: translateX(-50%) translateY(0); }
  #toast b, #toast .g { color: var(--champagne); }

  .voetnoot {
    font-family: var(--sans); font-size: 10px; letter-spacing: .16em; text-transform: uppercase;
    color: var(--grijs); text-align: center; margin-top: 34px;
  }
  @media (max-width: 640px) {
    .maison-naam { font-size: 22px; }
    .roltab { padding: 16px 14px 13px; letter-spacing: .14em; }
    .paneel { padding: 26px 20px; }
  }
</style>
</head>
<body>

<header class="maison quilt-donker">
  <div class="demo-chip">Demo</div>
  <div class="maison-naam">Timeless</div>
  <div class="maison-sub">La Maison de la Revente &mdash; Vintage Chanel</div>
  <div class="maison-lijn"></div>
</header>

<nav class="roltabs">
  <button class="roltab actief" data-rol="koper" onclick="toonRol('koper')">Boutique<span class="notif" id="notif-koper"></span></button>
  <button class="roltab" data-rol="atelier" onclick="toonRol('atelier')">Atelier<span class="notif" id="notif-atelier"></span></button>
  <button class="roltab" data-rol="verkoper" onclick="toonRol('verkoper')">Verkoper<span class="notif" id="notif-verkoper"></span></button>
</nav>

<div class="view actief" id="view-koper"></div>
<div class="view" id="view-atelier"></div>
<div class="view" id="view-verkoper"></div>

<div id="toast"></div>

<script>
// ─────────────────────────────────────────────────────────
// Gouden lijntekeningen (in plaats van productfoto's)
// ─────────────────────────────────────────────────────────
const TEKENINGEN = {

// ─────────────────────────────────────────────────────────
// Demodata — één order stroomt door alle drie de rollen
// ─────────────────────────────────────────────────────────
const ITEMS = [
  { id: 1, art: 'flap',      titel: 'Classic Flap Medium', jaar: 1995, conditie: 'Uitstekend',     verkoper: 'Vera V.',              zakelijk: false, prijs: 5800 },
  { id: 2, art: 'boy',       titel: 'Boy Bag Old Medium',  jaar: 2012, conditie: 'Goed',           verkoper: 'Vintage Boetiek B.V.', zakelijk: true,  prijs: 3400 },

  { id: 4, art: 'reissue',   titel: '2.55 Reissue 226',    jaar: 2006, conditie: 'Uitstekend',     verkoper: 'Harold B.',            zakelijk: false, prijs: 7200 },

  { id: 6, art: 'sjaal',     titel: 'Zijden Sjaal Camélia',jaar: 2001, conditie: 'Uitstekend',     verkoper: 'Vintage Boetiek B.V.', zakelijk: true,  prijs: 310 },
];

const STAPPEN = [
  { key: 'PAID',             titel: 'Betaald',                        toel: 'Uw betaling staat veilig vast bij het platform (Stripe) en wordt pas vrijgegeven na levering.' },
  { key: 'AWAITING_ITEM',    titel: 'Onderweg naar het atelier',      toel: 'De verkoper verzendt het stuk verzekerd naar ons atelier.' },
  { key: 'ITEM_RECEIVED',    titel: 'Ontvangen in het atelier',       toel: 'Het stuk is fysiek binnen en wordt klaargelegd voor expertise.' },
  { key: 'IN_INSPECTION',    titel: 'Expertise en authenticatie',     toel: 'Ons atelier controleert echtheid, conditie en overeenstemming met de beschrijving.' },
  { key: 'APPROVED',         titel: 'Authentiek bevonden',            toel: 'Goedgekeurd door onze experts. Het stuk wordt zorgvuldig verpakt.' },
  { key: 'SHIPPED_TO_BUYER', titel: 'Onderweg naar u',                toel: 'Verzekerd verzonden met track en trace.' },
  { key: 'DELIVERED',        titel: 'Geleverd',                       toel: 'Het pakket is bij u bezorgd.' },
  { key: 'COMPLETED',        titel: 'Voltooid',                       toel: 'De verkoper is direct uitbetaald. Veel plezier met uw aanwinst.' },
];

const KOPERSFEE = 0.05, VERKOPERSFEE = 0.10, VERZENDING = 12.50, RETOURKOSTEN = 9.50;

let order = null;
let kijkItem = null;
let scherm = 'browse';
let betaalmethode = 'iDEAL';
let bod = { status: 'geen' };

const eur = n => '€ ' + n.toLocaleString('nl-NL', { minimumFractionDigits: n % 1 ? 2 : 0 });
const art = (naam) => TEKENINGEN[naam];

function toast(html) {
  const t = document.getElementById('toast');
  t.innerHTML = html;
  t.classList.add('zichtbaar');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('zichtbaar'), 3600);
}
function notif(rol, aan) {
  document.getElementById('notif-' + rol).style.display = aan ? 'block' : 'none';
}
function toonRol(rol) {
  document.querySelectorAll('.roltab').forEach(b => b.classList.toggle('actief', b.dataset.rol === rol));
  document.querySelectorAll('.view').forEach(v => v.classList.remove('actief'));
  document.getElementById('view-' + rol).classList.add('actief');
  notif(rol, false);
  render();
}
function statusIndex() { return order ? STAPPEN.findIndex(s => s.key === order.status) : -1; }
function zetStatus(key, meldingHtml, notifRol) {
  order.status = key;
  if (meldingHtml) toast(meldingHtml);
  if (notifRol) notif(notifRol, true);
  render();
}

// ─────────────────────────────────────────────────────────
// BOUTIQUE (koper)
// ─────────────────────────────────────────────────────────
function renderKoper() {
  const v = document.getElementById('view-koper');
  if (scherm === 'detail' && kijkItem)   { v.innerHTML = htmlDetail(kijkItem); return; }
  if (scherm === 'checkout' && kijkItem) { v.innerHTML = htmlCheckout(kijkItem); return; }
  if (scherm === 'tracking' && order)    { v.innerHTML = htmlTracking(); return; }

  v.innerHTML = `
    <div class="centreer intro">
      <div class="voorregel">De Collectie</div>
      <h2 class="kop">Vintage Chanel, ge&euml;xpertiseerd</h2>
      <p class="sub">Elk stuk passeert fysiek ons atelier voordat het u bereikt. Kies een stuk om de volledige ervaring te doorlopen.</p>
    </div>
    ${order ? `<div class="melding">Er loopt een bestelling: <b>Chanel ${order.item.titel} ${order.item.jaar}</b> &mdash; <a href="#" onclick="scherm='tracking';render();return false">volg uw bestelling</a></div>` : ''}
    <div class="grid">
      ${ITEMS.map((it, i) => {
        const verkocht = order && order.item.id === it.id;
        return `
        <div class="kaart ${verkocht ? 'verkocht-overlay' : ''}" onclick="kijkItem=ITEMS[${i}];scherm='detail';render()">
          <div class="kaart-foto quilt">${art(it.art)}</div>
          <div class="kaart-info">
            <div class="kaart-titel">Chanel ${it.titel}</div>
            <div class="kaart-meta">${it.jaar} &middot; ${it.conditie} &middot; ${it.zakelijk ? 'Zakelijk' : 'Particulier'}</div>
            <div class="kaart-prijs ${verkocht ? 'verkocht' : ''}">${verkocht ? 'Verkocht' : eur(it.prijs)}</div>
          </div>
        </div>`;
      }).join('')}
    </div>
    <p class="voetnoot">Demo &mdash; de echte boutique toont 10.000+ stuks met zoeken en filters</p>`;
}

function htmlDetail(it) {
  return `
    <button class="terug" onclick="scherm='browse';render()">&larr; De collectie</button>
    <div class="paneel detail-flex">
      <div class="detail-foto quilt">${art(it.art)}</div>
      <div class="detail-info">
        <div class="voorregel">${it.jaar} &middot; Vintage</div>
        <h2 class="kop">Chanel ${it.titel}</h2>
        <div class="detail-prijs">${eur(it.prijs)}</div>
        <dl class="specs">
          <div class="spec"><dt>Conditie</dt><dd>${it.conditie}</dd></div>
          <div class="spec"><dt>Verkoper</dt><dd>${it.verkoper} <span class="goudtekst">&middot; ${it.zakelijk ? 'zakelijk' : 'particulier'}</span></dd></div>
          <div class="spec"><dt>Expertise</dt><dd>Fysiek geauthenticeerd in ons atelier</dd></div>
          ${it.zakelijk ? '<div class="spec"><dt>Bedenktijd</dt><dd>14 dagen herroepingsrecht</dd></div>' : ''}
        </dl>
        <button class="knop goud" onclick="kijkItem=ITEMS[${ITEMS.indexOf(it)}];scherm='checkout';render()">Acquisitie</button>
        <button class="knop sec" onclick="toast('Bieden ervaart u bij de rol <b>Verkoper</b>, rechtsboven')">Bod uitbrengen</button>
        ${!it.zakelijk ? '<p class="sub">U koopt van een particulier; wettelijk herroepingsrecht is niet van toepassing. Elk stuk wordt v&oacute;&oacute;r verzending fysiek ge&euml;xpertiseerd.</p>' : ''}
      </div>
    </div>`;
}

function htmlCheckout(it) {
  const fee = it.prijs * KOPERSFEE;
  const totaal = it.prijs + fee + VERZENDING;
  return `
    <button class="terug" onclick="scherm='detail';render()">&larr; Terug naar het stuk</button>
    <div class="paneel" style="max-width:560px;margin:0 auto">
      <div class="voorregel">Acquisitie</div>
      <h2 class="kop" style="font-size:24px">Chanel ${it.titel} ${it.jaar}</h2>
      <p class="sub" style="margin-bottom:14px">Uw betaling wordt veilig vastgehouden en pas na levering vrijgegeven aan de verkoper.</p>
      <div class="bon">
        <div class="bon-rij"><span class="oms">Het stuk</span><span>${eur(it.prijs)}</span></div>
        <div class="bon-rij"><span class="oms">Expertise en kopersbescherming (5%)</span><span>${eur(fee)}</span></div>
        <div class="bon-rij"><span class="oms">Verzekerde verzending</span><span>${eur(VERZENDING)}</span></div>
        <div class="bon-rij totaal"><span class="oms">Totaal</span><span>${eur(totaal)}</span></div>
      </div>
      <div class="betaalopties">
        ${['iDEAL', 'Kaart', 'Bancontact', 'SEPA'].map(m =>
          `<button class="betaaloptie ${betaalmethode === m ? 'gekozen' : ''}" onclick="betaalmethode='${m}';render()">${m}</button>`).join('')}
      </div>
      <button class="knop goud blok" onclick="betaal()">Betaal ${eur(totaal)} &mdash; ${betaalmethode}</button>
      <p class="voetnoot">In het echte platform is dit het Stripe-betaalscherm</p>
    </div>`;
}

function betaal() {
  order = { item: kijkItem, status: 'PAID', afgekeurd: false };
  scherm = 'tracking';
  toast('Betaling ontvangen. <b>De verkoper krijgt nu een verzekerd verzendlabel.</b>');
  notif('verkoper', true);
  render();
}

function htmlTracking() {
  const idx = statusIndex();
  return `
    <button class="terug" onclick="scherm='browse';render()">&larr; De collectie</button>
    <div class="paneel">
      <div class="voorregel">Order N&deg; TM-2026-001</div>
      <h2 class="kop" style="font-size:24px">Chanel ${order.item.titel} ${order.item.jaar}</h2>
      <p class="sub">Wissel van rol via de navigatie bovenaan om de volgende stap zelf uit te voeren.</p>
      ${order.afgekeurd ? `
        <div class="melding rood" style="margin-top:24px">
          <b>Expertise negatief.</b> Het stuk wijkt af van de beschrijving. Uw volledige betaling wordt teruggestort; het stuk gaat retour naar de verkoper op diens kosten. Zo beschermt de maison uw vertrouwen.
        </div>
        <button class="knop sec" onclick="resetDemo()">Demo opnieuw beginnen</button>` : `
        <ul class="tijdlijn">
          ${STAPPEN.map((s, i) => `
            <li class="${i < idx ? 'klaar' : i === idx ? 'nu' : ''}">
              <div class="stip">${i < idx ? '&#10003;' : ['I','II','III','IV','V','VI','VII','VIII'][i]}</div>
              <div><div class="stap-titel">${s.titel}</div><div class="stap-toel">${s.toel}</div></div>
            </li>`).join('')}
        </ul>
        ${order.status === 'SHIPPED_TO_BUYER' ? `<button class="knop" onclick="zetStatus('DELIVERED','Het pakket is bezorgd. Nog &eacute;&eacute;n stap.')">Simuleer de bezorging</button>` : ''}
        ${order.status === 'DELIVERED' ? `<button class="knop groen" onclick="zetStatus('COMPLETED','Voltooid. <b>De verkoper is direct uitbetaald.</b>', 'verkoper')">Bevestig ontvangst</button>` : ''}
        ${order.status === 'COMPLETED' ? `
          <div class="melding groen"><b>Voltooid.</b> Bekijk de uitbetaling bij de rol Verkoper, of begin de demo opnieuw.</div>
          <button class="knop sec klein" onclick="resetDemo()">Demo opnieuw beginnen</button>` : ''}
      `}
    </div>`;
}

// ─────────────────────────────────────────────────────────
// ATELIER
// ─────────────────────────────────────────────────────────
function renderAtelier() {
  const v = document.getElementById('view-atelier');
  const kop = `
    <div class="centreer intro">
      <div class="voorregel">Het Atelier</div>
      <h2 class="kop">Expertise en authenticatie</h2>
      <p class="sub">Hier werkt uw team. Dit is de vertrouwenslaag die geen concurrent kan kopi&euml;ren met software alleen.</p>
    </div>`;

  if (!order || order.afgekeurd || order.status === 'COMPLETED') {
    v.innerHTML = kop + `
      <div class="paneel leeg">
        <div class="orn">&#9670;&#9670;&#9670;</div>
        <p>${order && order.afgekeurd ? 'Het stuk is retour gezonden naar de verkoper.<br><br>' : ''}
        Geen stukken in de wachtrij.<br>
        ${!order ? 'Verwerf eerst een stuk in de <b>Boutique</b> om de flow te beginnen.' : 'Begin de demo opnieuw via de Boutique.'}</p>
      </div>`;
    return;
  }

  const it = order.item;
  let actie = '';
  if (order.status === 'PAID') {
    actie = `<div class="stap-uitleg">In afwachting van de verkoper. Ga naar de rol <b>Verkoper</b> om het pakket te verzenden.</div>`;
  } else if (order.status === 'AWAITING_ITEM') {
    actie = `<button class="knop" onclick="zetStatus('ITEM_RECEIVED','Het stuk is binnengeboekt in het atelier.','koper')">Stuk binnenboeken</button>`;
  } else if (order.status === 'ITEM_RECEIVED') {
    actie = `<button class="knop" onclick="zetStatus('IN_INSPECTION','De expertise is begonnen.','koper')">Begin de expertise</button>`;
  } else if (order.status === 'IN_INSPECTION') {
    actie = `
      <div class="stap-uitleg"><b>Expertiseprotocol:</b> hologramsticker en serienummer &middot; stiksels (zeven per centimeter) &middot; hardware-gravures &middot; leerstructuur en geur &middot; vergelijking met de listingfoto's.</div>
      <button class="knop groen" onclick="zetStatus('APPROVED','Authentiek bevonden en goedgekeurd.','koper')">Goedkeuren</button>
      <button class="knop rood" onclick="keurAf()">Afkeuren</button>`;
  } else if (order.status === 'APPROVED') {
    actie = `<button class="knop" onclick="zetStatus('SHIPPED_TO_BUYER','Verzekerd verzonden naar de koper.','koper')">Verzend naar de koper</button>`;
  } else {
    actie = `<div class="stap-uitleg">Onderweg naar de koper. Ga naar de <b>Boutique</b> om de levering te simuleren.</div>`;
  }

  const stap = STAPPEN.find(s => s.key === order.status);
  v.innerHTML = kop + `
    <div class="wachtrij-item">
      <div class="mini-foto quilt">${art(it.art)}</div>
      <div class="wachtrij-info">
        <div class="wachtrij-titel">Chanel ${it.titel} ${it.jaar}</div>
        <div class="wachtrij-meta">Order N&deg; TM-2026-001 &middot; ${eur(it.prijs)} &middot; verkoper: ${it.verkoper}</div>
      </div>
      <span class="status-chip">${stap ? stap.titel : order.status}</span>
    </div>
    <div class="paneel">${actie}</div>`;
}

function keurAf() {
  order.afgekeurd = true;
  order.status = 'REJECTED';
  toast('<b>Afgekeurd.</b> De koper wordt volledig terugbetaald; het stuk gaat retour op kosten van de verkoper.');
  notif('koper', true); notif('verkoper', true);
  render();
}

// ─────────────────────────────────────────────────────────
// VERKOPER
// ─────────────────────────────────────────────────────────
function renderVerkoper() {
  const v = document.getElementById('view-verkoper');
  const kop = `
    <div class="centreer intro">
      <div class="voorregel">Uw Consignatie</div>
      <h2 class="kop">Verkopersaccount</h2>
      <p class="sub">Vera V. &middot; particulier &middot; geverifieerd via Stripe</p>
    </div>`;

  const bodBlok = `
    <div class="paneel">
      <div class="sectiekop">Bieden en onderhandelen</div>
      ${bod.status === 'geen' ? `
        <p class="sub" style="margin:0 0 18px">Zo voelt een binnenkomend bod:</p>
        <button class="knop klein" onclick="bod={status:'ontvangen'};render()">Simuleer een bod van &euro; 5.200 op uw Classic Flap</button>` : ''}
      ${bod.status === 'ontvangen' ? `
        <div class="melding"><b>Nieuw bod: € 5.200</b> van Koos K. op Chanel Classic Flap Medium 1995 (vraagprijs € 5.800) &middot; vervalt over 72 uur</div>
        <button class="knop groen klein" onclick="bod={status:'geaccepteerd'};toast('Bod geaccepteerd. <b>De koper kan nu afrekenen voor € 5.200.</b>');render()">Accepteren</button>
        <button class="knop klein" onclick="bod={status:'tegenbod'};toast('Tegenbod van € 5.500 verzonden.');render()">Tegenbod € 5.500</button>
        <button class="knop rood klein" onclick="bod={status:'afgewezen'};render()">Afwijzen</button>` : ''}
      ${bod.status === 'geaccepteerd' ? `<div class="melding groen">Bod van € 5.200 geaccepteerd. De koper heeft 24 uur om af te rekenen; het stuk staat zolang gereserveerd.</div>` : ''}
      ${bod.status === 'tegenbod' ? `<div class="melding">Tegenbod van € 5.500 verzonden. De koper kan accepteren, afwijzen of opnieuw bieden.</div>` : ''}
      ${bod.status === 'afgewezen' ? `<div class="melding">Bod afgewezen. Het stuk blijft in de collectie.</div>` : ''}
      ${bod.status !== 'geen' ? `<button class="terug" style="margin:14px 0 0" onclick="bod={status:'geen'};render()">bod-demo herstellen</button>` : ''}
    </div>`;

  if (!order) {
    v.innerHTML = kop + `
      <div class="paneel leeg">
        <div class="orn">&#9670;&#9670;&#9670;</div>
        <p>Nog geen verkopen.<br>Verwerf een stuk in de <b>Boutique</b> om te ervaren wat u als verkoper meemaakt.</p>
      </div>` + bodBlok;
    return;
  }

  const it = order.item;
  const netto = it.prijs * (1 - VERKOPERSFEE) - RETOURKOSTEN * 0 - 9.5;
  let inhoud = '';

  if (order.afgekeurd) {
    inhoud = `
      <div class="melding rood"><b>Expertise negatief.</b> Het stuk komt retour; de retourkosten (${eur(RETOURKOSTEN)}) zijn voor uw rekening. De verkoop gaat niet door.</div>
      <button class="knop sec klein" onclick="resetDemo()">Demo opnieuw beginnen</button>`;
  } else if (order.status === 'PAID') {
    inhoud = `
      <div class="melding"><b>Verkocht.</b> Chanel ${it.titel} ${it.jaar} voor ${eur(it.prijs)}. Uw verzekerde verzendlabel staat gereed.</div>
      <div class="bon">
        <div class="bon-rij"><span class="oms">Verkoopprijs</span><span>${eur(it.prijs)}</span></div>
        <div class="bon-rij"><span class="oms">Commissie van de maison (10%)</span><span>&minus; ${eur(it.prijs * VERKOPERSFEE)}</span></div>
        <div class="bon-rij"><span class="oms">Verzending naar het atelier</span><span>&minus; € 9,50</span></div>
        <div class="bon-rij totaal"><span class="oms">Uw uitbetaling na levering</span><span>${eur(netto)}</span></div>
      </div>
      <button class="knop goud" onclick="zetStatus('AWAITING_ITEM','Het pakket is onderweg naar het atelier.','atelier')">Label geprint &mdash; pakket meegegeven</button>`;
  } else if (order.status === 'COMPLETED') {
    inhoud = `
      <div class="melding groen"><b>Uitbetaald: ${eur(netto)}</b> &mdash; direct overgemaakt via Stripe zodra de koper de ontvangst bevestigde. Geen wachttijden, geen batches.</div>
      <button class="knop sec klein" onclick="resetDemo()">Demo opnieuw beginnen</button>`;
  } else {
    const stap = STAPPEN.find(s => s.key === order.status);
    const groenChip = ['APPROVED', 'SHIPPED_TO_BUYER', 'DELIVERED'].includes(order.status);
    inhoud = `
      <div class="wachtrij-item" style="border:none;padding:0;margin-bottom:18px">
        <div class="mini-foto quilt">${art(it.art)}</div>
        <div class="wachtrij-info">
          <div class="wachtrij-titel">Chanel ${it.titel} ${it.jaar}</div>
          <div class="wachtrij-meta">Verwachte uitbetaling: ${eur(netto)}</div>
        </div>
        <span class="status-chip ${groenChip ? 'groen' : ''}">${stap ? stap.titel : ''}</span>
      </div>
      <div class="stap-uitleg" style="margin:0">U hoeft niets te doen. Het atelier en de koper zetten de volgende stappen; wissel van rol om ze uit te voeren.</div>`;
  }

  v.innerHTML = kop + `<div class="paneel"><div class="sectiekop">Uw verkoop</div>${inhoud}</div>` + bodBlok;
}

function resetDemo() {
  order = null; kijkItem = null; scherm = 'browse';
  ['koper', 'atelier', 'verkoper'].forEach(r => notif(r, false));
  toast('De demo is hersteld. Verwerf opnieuw een stuk om de flow te beginnen.');
  render();
}

function render() { renderKoper(); renderAtelier(); renderVerkoper(); }
render();
</script>
</body>
</html>
